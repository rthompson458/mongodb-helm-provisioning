apiVersion: batch/v1
kind: Job

metadata:
  name: mongodb-database-provisioner
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation

spec:
  backoffLimit: 3

  template:
    metadata:
      name: mongodb-database-provisioner

    spec:
      restartPolicy: Never

      containers:
        - name: mongodb-database-provisioner
          image: mongo:8.0
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-provisioner-connection
                  key: connectionString.standard

          command:
            - /bin/bash
            - -c
            - |
              set -e

              echo "Starting MongoDB database provisioning"
              mongosh "$MONGODB_URI" --quiet <<'EOF_MONGO'
              const desiredDatabases = {{ .Values.mongodbDatabases | default (list) | toJson }};
              const operations = {{ .Values.mongodbDatabaseOperations | default (list) | toJson }};

              let effectiveDatabases = desiredDatabases.map(database => ({
                name: database.name,
                collections: [...database.collections]
              }));

              // auditState is read-only. It captures MongoDB runtime before this
              // post-upgrade Job executes. Do not recreate a database or collection
              // that the audit intentionally observed as absent. MongoControl.py
              // will adopt the snapshot into Spacelift after the run finishes.
              if (operations.some(op => op.action === "auditState")) {
                print("Runtime audit detected; additive database provisioning skipped.");
                quit(0);
              }

              // During the same Helm upgrade, destructive/rename operations run
              // before this Job. Apply those transformations to the desired list
              // so the additive provisioner does not recreate deleted/renamed data.
              for (const op of operations) {
                if (op.action === "deleteDatabase") {
                  effectiveDatabases = effectiveDatabases.filter(
                    database => database.name !== op.database
                  );
                  continue;
                }

                const database = effectiveDatabases.find(
                  item => item.name === op.database
                );
                if (!database) {
                  continue;
                }

                if (op.action === "deleteCollection") {
                  database.collections = database.collections.filter(
                    collection => collection !== op.collection
                  );
                  continue;
                }

                if (op.action === "renameCollection") {
                  database.collections = database.collections.map(
                    collection => collection === op.collection ? op.newName : collection
                  );
                  database.collections = [...new Set(database.collections)];
                }
              }

              for (const databaseDefinition of effectiveDatabases) {
                const database = db.getSiblingDB(databaseDefinition.name);
                const existingCollections = database.getCollectionNames();

                for (const collection of databaseDefinition.collections) {
                  if (!existingCollections.includes(collection)) {
                    database.createCollection(collection);
                    print(`Created ${databaseDefinition.name}.${collection}`);
                  } else {
                    print(`Exists ${databaseDefinition.name}.${collection}`);
                  }
                }
              }
              EOF_MONGO
              echo "MongoDB database provisioning completed"
