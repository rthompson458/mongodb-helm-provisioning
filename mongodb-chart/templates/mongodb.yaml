apiVersion: mongodb.com/v1
kind: MongoDB

metadata:
  name: {{ .Values.mongodb.name }}
  namespace: {{ .Release.Namespace }}

spec:
  type: ReplicaSet
  members: {{ .Values.mongodb.members }}
  version: {{ .Values.mongodb.version | quote }}

  opsManager:
    configMapRef:
      name: {{ .Values.mongodb.opsManagerConfigMap }}

  credentials: {{ .Values.mongodb.credentialsSecret }}
