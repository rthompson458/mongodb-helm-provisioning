mongodb:
  name: mongodb-development
  members: 3
  version: "8.0.0"
  opsManagerConfigMap: my-project
  credentialsSecret: organization-secret

mongodbUsers:
  - resourceName: mongodb-admin
    username: mongodb-admin
    authDatabase: admin
    passwordSecret: mongodb-admin-password
    passwordKey: password
    connectionStringSecret: mongodb-admin-connection
    roles:
      - db: admin
        name: root
        
  - resourceName: mongodb-provisioner
    username: mongodb-provisioner
    authDatabase: admin
    passwordSecret: mongodb-provisioner-password
    passwordKey: password
    connectionStringSecret: mongodb-provisioner-connection
    roles:
      - db: admin
        name: readWriteAnyDatabase

mongodbDatabases:
  - name: Cars
    collections:
      - make
      - model
      - year
      - color
  - name: Inventory
    collections:
      - products
      - warehouses
      

mongodbRequestUsers: []

# Controlled one-shot operations submitted by MongoControl.py.
# Supported actions: auditState, renameCollection, deleteCollection, deleteDatabase.
mongodbDatabaseOperations: []
