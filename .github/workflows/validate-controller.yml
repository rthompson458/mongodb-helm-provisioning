name: Validate terraformController

on:
  pull_request:
    paths:
      - "terraformController.py"
      - "terraform_controller/**"
      - "terraform-dbaas/**"
      - "terraformController.config"
      - ".github/workflows/validate-controller.yml"
  push:
    branches:
      - main
    paths:
      - "terraformController.py"
      - "terraform_controller/**"
      - "terraform-dbaas/**"
      - "terraformController.config"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python3 -m py_compile terraformController.py terraform_controller/*.py tests/*.py

      - name: Run controller unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate lifecycle Bash syntax
        run: bash -n terraform-dbaas/scripts/lifecycle.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Check Terraform formatting
        run: terraform -chdir=terraform-dbaas fmt -check -diff -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir=terraform-dbaas init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform-dbaas validate
