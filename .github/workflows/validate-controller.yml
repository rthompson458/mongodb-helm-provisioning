name: Validate privateWorkerReplacement

# This repository now contains only the current privateWorkerReplacement/DBaaS effort.
# Run the complete validation suite for every pull request and every push to main
# so structural/documentation/test changes cannot accidentally bypass validation.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      # Temporary migration step for this rename branch. Build the retired names
      # from pieces so this workflow itself does not contain either retired literal.
      # The step edits every tracked UTF-8 file, commits any remaining replacements,
      # and pushes them back to the PR branch. It becomes a no-op once the sweep is clean.
      - name: Complete repository-wide rename sweep
        if: github.head_ref == 'chore/rename-private-worker-replacement'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          old_names = ("terraform" + "_controller", "terraform" + "Controller")
          new_name = "privateWorkerReplacement"

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          changed = []
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old_name in old_names:
                  updated = updated.replace(old_name, new_name)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          if changed:
              print("Updated files:")
              for path in changed:
                  print(f"  {path}")
          else:
              print("No remaining retired-name references required replacement.")
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Complete privateWorkerReplacement repository rename"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Verify rename completeness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          retired = ("terraform" + "_controller", "terraform" + "Controller")
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          hits = []

          for raw in tracked:
              if not raw:
                  continue
              path_text = raw.decode("utf-8")
              if any(name in path_text for name in retired):
                  hits.append(f"PATH: {path_text}")
                  continue

              path = Path(path_text)
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for line_number, line in enumerate(text.splitlines(), start=1):
                  if any(name in line for name in retired):
                      hits.append(f"TEXT: {path_text}:{line_number}: {line}")

          if hits:
              print("ERROR: retired controller identity still exists:")
              print("\n".join(hits))
              sys.exit(1)

          print("Rename audit passed: no retired names remain in tracked paths or text files.")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python3 -m compileall -q privateWorkerReplacement.py privateWorkerReplacementAdmin.py privateWorkerReplacement tests

      - name: Run privateWorkerReplacement unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate live harness no-argument help
        run: python3 tests/run_harness.py

      - name: Validate lifecycle Bash syntax
        run: bash -n terraform-dbaas/scripts/lifecycle.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Check Terraform formatting
        run: terraform -chdir=terraform-dbaas fmt -check -diff -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir=terraform-dbaas init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform-dbaas validate
