name: Validate terraformController

# This repository now contains only the current terraformController/DBaaS effort.
# Run the complete validation suite for every pull request and every push to main
# so structural/documentation/test changes cannot accidentally bypass validation.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python3 -m compileall -q terraformController.py terraform_controller tests

      - name: Run controller unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate live harness CLI
        run: python3 tests/run_harness.py --help

      - name: Validate lifecycle Bash syntax
        run: bash -n terraform-dbaas/scripts/lifecycle.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Check Terraform formatting
        run: terraform -chdir=terraform-dbaas fmt -check -diff -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir=terraform-dbaas init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform-dbaas validate
